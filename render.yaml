# Render Blueprint for Lerno
#
# Architecture:
# - Frontend: Render Static Site
# - Backend: Render Web Service
# - Database/Auth: Supabase
#
# This repository is an npm-workspaces monorepo.
# The root package.json and package-lock.json are therefore intentionally
# used by both services.

services:
  # ============================================================
  # BACKEND
  # ============================================================
  - type: web
    name: lerno-backend
    runtime: node
    plan: free
    region: frankfurt

    buildCommand: npm ci && npm run build --workspace=backend
    startCommand: npm start --workspace=backend

    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      - key: SUPABASE_URL
        sync: false

      - key: SUPABASE_ANON_KEY
        sync: false

      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      - key: FRONTEND_URL
        sync: false

      - key: PUBLIC_BACKEND_URL
        sync: false

      - key: HEALTH_CHECK_DB
        value: "true"

    buildFilter:
      paths:
        - backend/**
        - package.json
        - package-lock.json
        - tsconfig.base.json
        - eslint.config.js
        - .prettierrc.json

  # ============================================================
  # FRONTEND
  # ============================================================
  - type: web
    name: lerno-frontend
    runtime: static

    buildCommand: npm ci && npm run build --workspace=frontend
    staticPublishPath: frontend/dist

    routes:
      # React Router / Vite SPA fallback.
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: VITE_API_BASE_URL
        sync: false

      - key: VITE_SUPABASE_URL
        sync: false

      - key: VITE_SUPABASE_ANON_KEY
        sync: false

    buildFilter:
      paths:
        - frontend/**
        - package.json
        - package-lock.json
        - tsconfig.base.json
        - eslint.config.js
        - .prettierrc.json
