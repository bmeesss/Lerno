# Render Blueprint for Lerno
#
# Architecture:
# - Frontend: Render Static Site
# - Backend: Render Web Service
# - Database/Auth: Supabase
#
# This repository is an npm-workspaces monorepo.
# The root package.json and package-lock.json are intentionally used
# by both services.
#
# Secrets are never stored in this file.
# Values marked with sync: false are entered in Render.

services:
  # ============================================================
  # BACKEND
  # ============================================================
  - type: web
    name: lerno-backend
    runtime: node
    plan: free
    region: frankfurt

    # Root is intentionally the repository root because the project
    # uses npm workspaces and has one shared package-lock.json.
    buildCommand: npm ci --include=dev && npm run build --workspace=backend
    startCommand: npm start --workspace=backend

    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      - key: SUPABASE_URL
        sync: false

      - key: SUPABASE_ANON_KEY
        sync: false

      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      - key: FRONTEND_URL
        sync: false

      - key: PUBLIC_BACKEND_URL
        sync: false

      # Lerno AI — server-side only. Get a key at https://console.groq.com
      - key: GROQ_API_KEY
        sync: false

      # Lerno AI chat model (change to switch models later).
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b

      # Response budget / sampling / timeout for Lerno AI.
      - key: GROQ_MAX_OUTPUT_TOKENS
        value: '2048'

      - key: GROQ_TEMPERATURE
        value: '0.6'

      - key: GROQ_TIMEOUT_MS
        value: '30000'

      - key: GROQ_MAX_RETRIES
        value: '1'

      # Lerno AI fallback provider (Cerebras Inference) — server-side only.
      # Groq stays primary; this key is optional and only used when a Groq call
      # fails transiently (rate limit, timeout, network, provider outage).
      # Get a key at https://cloud.cerebras.ai. Never a value here.
      - key: CEREBRAS_API_KEY
        sync: false

      # Cerebras fallback model / endpoint / budget.
      - key: CEREBRAS_MODEL
        value: gpt-oss-120b

      - key: CEREBRAS_BASE_URL
        value: https://api.cerebras.ai/v1

      - key: CEREBRAS_TIMEOUT_MS
        value: '30000'

      # 0 = exactly one fallback attempt per user request, never a retry loop.
      - key: CEREBRAS_MAX_RETRIES
        value: '0'

      # Structured output + context bounds for the AI study features.
      - key: GROQ_JSON_MODE
        value: 'true'

      - key: AI_CONTEXT_MAX_CARDS
        value: '60'

      - key: AI_CONTEXT_MAX_CHARS
        value: '12000'

      # Lerno AI quota per user per window (stricter than normal API limits).
      - key: AI_RATE_LIMIT_MAX
        value: '20'

      - key: AI_RATE_LIMIT_WINDOW_MS
        value: '300000'

      - key: AI_RATE_LIMIT_IP_MAX
        value: '60'

      - key: HEALTH_CHECK_DB
        value: 'true'

    buildFilter:
      paths:
        - backend/**
        - package.json
        - package-lock.json
        - tsconfig.base.json
        - eslint.config.js
        - .prettierrc.json

  # ============================================================
  # FRONTEND
  # ============================================================
  - type: web
    name: lerno-frontend
    runtime: static

    # The repository root is used because the frontend is an npm
    # workspace managed by the root package-lock.json.
    buildCommand: npm ci --include=dev && npm run build --workspace=frontend
    staticPublishPath: frontend/dist

    routes:
      # React Router / Vite SPA fallback.
      # Required so direct navigation to /dashboard, /sets, etc.
      # does not return a 404.
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: VITE_API_BASE_URL
        sync: false

      - key: VITE_SUPABASE_URL
        sync: false

      - key: VITE_SUPABASE_ANON_KEY
        sync: false

    buildFilter:
      paths:
        - frontend/**
        - package.json
        - package-lock.json
        - tsconfig.base.json
        - eslint.config.js
        - .prettierrc.json
